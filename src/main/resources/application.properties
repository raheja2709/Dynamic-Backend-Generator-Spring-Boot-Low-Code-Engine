spring.application.name=user.driven.operation.management

# Default profile
spring.profiles.default=dev

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Generated Projects Directory
app.generated-projects.directory=${APP_GENERATED_PROJECTS_DIR:./generated-projects}

# Maven Executable Path
app.maven.executable=${APP_MAVEN_PATH:mvn}

# Log Retention Configuration
app.log-retention-days=30
