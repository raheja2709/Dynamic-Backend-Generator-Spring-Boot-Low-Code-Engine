# Test Profile - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

# JWT test secret
app.jwt.secret=dGVzdFNlY3JldEtleVRoYXRJc0F0TGVhc3QyNTZCaXRzTG9uZ0ZvckhTMjU2QWxnb3JpdGht
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# Generated projects directory for tests
app.generated-projects.directory=./target/test-generated-projects
app.maven.executable=mvn

# Disable scheduling in tests
spring.task.scheduling.enabled=false
